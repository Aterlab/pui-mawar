<!DOCTYPE html>
<html lang="pl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PUI MAWAR - Pracownia Projektów</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- GSAP + ScrollTrigger -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/split-type"></script>
    <script src="https://unpkg.com/lenis@1.1.18/dist/lenis.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@500&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css">

    <!-- Hotjar  -->
    <script src="https://t.contentsquare.net/uxa/713c0dbb978ae.js"></script>
</head>

<body>
    <div class="grain"></div>

    <div class="columns">
        <div class="column"></div>
        <div class="column"></div>
        <div class="column"></div>
        <div class="column"></div>
        <div class="column" id="mobile-hidden"></div>
        <div class="column" id="mobile-hidden"></div>
        <div class="column" id="mobile-hidden"></div>
        <div class="column" id="mobile-hidden"></div>
        <div class="column" id="mobile-hidden"></div>
        <div class="column" id="mobile-hidden"></div>
        <div class="column" id="mobile-hidden"></div>
        <div class="column" id="mobile-hidden"></div>
    </div>

    <nav>
        <div class="left">
            <button class="logo">
                <p id="content">PUI MAWAR</p>
                <p id="content">Pełna strona już wkrótce</p>
            </button>
        </div>

        <div class="right">
            <button class="link">
                <p id="content">O pracowni</p>
                <p id="content">Już wkrótce</p>
            </button>
            <button class="link">
                <p id="content">Realizacje</p>
                <p id="content">Już wkrótce</p>
            </button>
            <button>
                <p id="content">Skontaktuj się</p>
                <p id="content">Już wkrótce</p>
            </button>
        </div>
    </nav>

    <section id="hero">
        <h1 class="headline">PUI MAWAR</h1>

        <div class="bottom">
            <div class="info">
                <div class="small-text" id="notice">( Strona w trakcie budowy )</div>
                <div id="desc" class="big-text">Krótki opis pracowni, opisujący działalność i projekty w ciekawy
                    sposób. Około 2-3 zdań.
                </div>
                <button>
                    <p id="content">O pracowni</p>
                    <p id="content">Już wkrótce</p>
                </button>
            </div>

            <div class="projects" id="projects-hero">
                <img id="expand-img" src="assets/projects/modernizacja_stacji_wodociagowej-2004-lublin.jpg" alt="">
            </div>
        </div>
    </section>

    <script>


        /* ── Lenis smooth scroll wired to GSAP ticker ── */
        const lenis = new Lenis({
            duration: 1,
            easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
            smooth: true,
            direction: 'vertical'
        });

        lenis.on('scroll', ScrollTrigger.update);
        gsap.ticker.add((time) => { lenis.raf(time * 1000); });
        gsap.ticker.lagSmoothing(0);

        /* ── Hero text animations ── */
        window.addEventListener('load', () => {
            const desc = new SplitType('#desc', { type: 'words, lines', mask: 'lines', linesClass: 'line++' });
            gsap.from(desc.words, { opacity: 0, y: 100, duration: 0.8, delay: 0.2, ease: 'power4.out', stagger: { amount: 0.25, from: 'start' } });

            const headline = new SplitType('.headline', { type: 'chars, lines', mask: 'lines', linesClass: 'line++' });
            gsap.from(headline.chars, { opacity: 0, y: 200, duration: 0.8, delay: 0.2, ease: 'power4.out', stagger: { amount: 0.25, from: 'start' } });

            const notice = new SplitType('#notice', { type: 'chars, lines', mask: 'lines', linesClass: 'line++' });
            gsap.from(notice.chars, { opacity: 0, y: 200, duration: 0.8, delay: 0.2, ease: 'power4.out', stagger: { amount: 0.25, from: 'start' } });
        });
    </script>

</body>

</html>
